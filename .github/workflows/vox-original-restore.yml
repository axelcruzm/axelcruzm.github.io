name: Restore original VOX Voice Studio
on:
  push:
    paths:
      - '.github/workflows/vox-original-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-vox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore exact approved browser assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import subprocess, hashlib, json, re
          base='https://vox-vision-scope-2027.mapachon.chatgpt.site/'
          root=Path('vox')
          root.mkdir(parents=True,exist_ok=True)
          targets={
            'studio/voices.js': ('voices.js','15652578a11df332b931424e93bdf3667038bb3eb2814f6edb57790b1c236b15'),
            'studio/inkwell.js': ('inkwell.js','30ab40b10da5d2fef936d5cf410a3e83794ec7878ce70c481f438f405da2374c'),
            'studio/studio.js?v=14': ('studio.js','d2a2bc444efa2852e5b9fa4101abd2627d46da333d49456d5213b4227c3f95c7'),
            'studio/services.js?v=11': ('services.js','1f0c12897db2c50a1d3b743d085e863f869a2fbef4eb38c89176ec078979cd41'),
            'studio/studio.css?v=14': ('studio.css','424e0b0cca96d96bcd276f63cffa796a24d56b40df1d7708f6e2b829952e68a8'),
            'studio/paper.svg': ('paper.svg','411ce1ce3822dfec12b211c3b69d5b278994d27c2db18e80a64a3564c82a27ec'),
            'assets/vox-navy.png': ('assets/vox-navy.png','529eac9ac984a6f2710e1bbab053ad73ff3710c2014795a0d743ffd6782398a2'),
            'studio/quill/vox-pluma.webm': ('quill/vox-pluma.webm','99e03eec12c692084a1d121bb00729ed684c5cc0c3407f2e8d3e27a7f0ce13e6'),
            'studio/quill/vox-pluma.webp': ('quill/vox-pluma.webp','9538420d7fd9cd2876e160343d33d6743e5f1823f631aaeae672572e79671c91'),
            'studio/quill/vox-pluma-poster.webp': ('quill/vox-pluma-poster.webp','f477f669246968600716d2c8345e070f49aceb77bc98412a9889007cb1befe6b')
          }
          def get(relative,required=True):
            url=urljoin(base,relative)
            result=subprocess.run(['curl','--fail','-L','--silent','--show-error','--retry','3','--retry-delay','2',
               '--connect-timeout','15','--max-time','60','-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0',url],capture_output=True)
            if result.returncode:
              if required: raise RuntimeError('Cannot download '+url+': '+result.stderr.decode(errors='replace')[-250:])
              print('OPTIONAL not retrieved:',relative)
              return None
            return result.stdout
          manifest=[]
          for remote,(local,expected) in targets.items():
            data=get(remote)
            digest=hashlib.sha256(data).hexdigest()
            if digest!=expected:
              raise RuntimeError('Original VOX resource changed since capture: '+remote+' '+digest)
            target=root/local
            target.parent.mkdir(parents=True,exist_ok=True)
            if local=='studio.css':
              css=data.decode('utf-8')
              css=re.sub(r'@font-face\{font-family:(?:Raleway|Lora);[^}]*\}', '', css)
              data=css.encode('utf-8')
            elif local=='services.js':
              data=data.replace(b'../assets/vox-mark.png',b'assets/vox-mark.png')
            target.write_bytes(data)
            manifest.append({'path':local,'original_sha256':expected,'bytes':len(data)})
            print('Verified:',local)
          html=get('studio/')
          text=html.decode('utf-8',errors='replace')
          if 'id="ink-scene"' not in text or 'id="studio-quill"' not in text or 'VOX ET VERITAS' not in text:
            raise RuntimeError('Site response did not contain the approved VOX studio; refuse to publish')
          prefix=text.split('</noscript>')[0]+'</noscript>'
          reference='e8199d44599784f59ea11801e5d7c0702d6a20054d18f62e3948e283def20abf'
          actual=hashlib.sha256(prefix.encode('utf-8')).hexdigest()
          if actual!=reference:
            raise RuntimeError('Approved VOX HTML differs from captured original: '+actual)
          text=prefix+'\n</body>\n</html>\n'
          text=text.replace('../assets/vox-navy.png','assets/vox-navy.png')
          text=text.replace('<link rel="stylesheet" href="studio.css?v=14">',
            '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
            '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
            '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&amp;family=Lora:ital,wght@1,400;1,500;1,600;1,700&amp;display=swap">\n'
            '<link rel="stylesheet" href="studio.css?v=14">')
          (root/'index.html').write_text(text,encoding='utf-8')
          # Images shown only inside service popups were not present in browser capture.
          optional={
            'studio/services-media/writing.png':'services-media/writing.png',
            'studio/services-media/editing.png':'services-media/editing.png',
            'studio/services-media/translation.png':'services-media/translation.png',
            'studio/services-media/jhoana-nichols.jpg':'services-media/jhoana-nichols.jpg',
            'assets/vox-mark.png':'assets/vox-mark.png'
          }
          missing=[]
          for remote,local in optional.items():
            data=get(remote,False)
            if data and (data.startswith(b'\x89PNG\r\n') or data.startswith(b'\xff\xd8')):
              target=root/local;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              print('Additional original media:',local)
            else: missing.append(local)
          (root/'CAPTURE_MANIFEST.json').write_text(json.dumps({'verified_browser_original':True,
            'origin':base+'studio/','snapshot_sha256':reference,
            'files':manifest,'missing_popup_media':missing,
            'fonts':'RALeWAY and Lora via Google Fonts (binaries not mirrored)'},indent=2)+'\n')
          print('All required files verified. Optional unavailable:',missing)
          PY
      - name: Commit recovered original in VOX folder only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vox
          if git diff --cached --quiet; then
            echo "Original VOX is already committed."
          else
            git commit -m "restore(vox): exact approved Voice Studio, original canvas and transparent quill"
            git push
          fi
